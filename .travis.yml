language: cpp
dist: bionic
matrix:
  include:
  - os: linux
    env: PYTHON=3.7
      addons:
        apt:
          sources:
          - ubuntu-toolchain-r-test
          packages:
          - gcc-7.5
          - g++-7.5
before_install:
- |
  export CXX=g++-7.5 CC=gcc-7.5
  sudo apt-get install -y libeigen3-dev python3-pip python$PYTHON python$PYTHON-dev
  pip3 install --user --upgrade pip virtualenv
  virtualenv -p python$PYTHON venv
  source venv/bin/activate
install:
- |
  python setup.py sdist
  pip install --verbose dist/*.tar.gz
  pip install tox
script:
  - tox -v -e py
