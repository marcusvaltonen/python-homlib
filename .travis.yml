language: cpp
dist: bionic
matrix:
  include:
  - os: linux
    env: PYTHON=3.6
  - os: linux
    env: PYTHON=3.7
  - os: linux
    env: PYTHON=3.8
before_install:
- |
  sudo apt-get update
  sudo apt-get install -y libeigen3-dev python3-pip python$PYTHON python$PYTHON-dev
  pip3 install --user --upgrade pip virtualenv
  virtualenv -p python$PYTHON venv
  source venv/bin/activate
install:
- |
  python setup.py sdist
  pip install --verbose dist/*.tar.gz
  pip install pytest pytest-approvaltests pytest-flake8
script:
- |
  pytest -s --ignore=lib
  pytest -s --ignore=lib --flake8
